name: Backfill stock history (one-off)

# Manual, one-shot deep backfill of data/stock_history.csv straight from the
# Shopify Admin API (ShopifyQL `inventory` dataset). Run it once to fill the OOS
# Impact Analytics dashboard with ~10 months of per-SKU daily stock; afterwards
# the daily refresh_matrixify.yml keeps it current for free. No recurring creds —
# you can remove the secrets again once this has run.
#
# One-time setup (repo → Settings → Secrets and variables → Actions):
#   SHOPIFY_SHOP          e.g. vegavero.myshopify.com
#   SHOPIFY_ADMIN_TOKEN   Admin API access token with the read_reports scope
# For the Wowtamins store use SHOPIFY_SHOP_WOWTAMINS / SHOPIFY_ADMIN_TOKEN_WOWTAMINS
# and pick store = wowtamins (run its Matrixify refresh once first).
# Then: Actions → "Backfill stock history (one-off)" → Run workflow (pick this branch).

on:
  workflow_dispatch:
    inputs:
      since:
        description: "First day to pull (YYYY-MM-DD)"
        default: "2025-09-01"
        required: true
      store:
        description: "Which store"
        type: choice
        options: [vegavero, wowtamins]
        default: vegavero

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATA_DIR: ${{ inputs.store == 'wowtamins' && 'data/wowtamins' || 'data' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so --backfill can also fold in git snapshots
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-export.txt
      - name: Pull deep stock history from Shopify
        env:
          # Each store reads only its own secrets (no fallback to the other store's).
          SHOPIFY_SHOP: ${{ inputs.store == 'wowtamins' && secrets.SHOPIFY_SHOP_WOWTAMINS || '' }}${{ inputs.store != 'wowtamins' && secrets.SHOPIFY_SHOP || '' }}
          SHOPIFY_ADMIN_TOKEN: ${{ inputs.store == 'wowtamins' && secrets.SHOPIFY_ADMIN_TOKEN_WOWTAMINS || '' }}${{ inputs.store != 'wowtamins' && secrets.SHOPIFY_ADMIN_TOKEN || '' }}
        run: python refresh_stock_history.py --since "${{ inputs.since }}" --out "$DATA_DIR/stock_overview_seed.csv"
      - name: Merge seed + git snapshots into the store's stock_history.csv
        run: >
          python build_stock_history.py --backfill
          --products "$DATA_DIR/matrixify_products.csv"
          --out "$DATA_DIR/stock_history.csv"
          --seed "$DATA_DIR/stock_overview_seed.csv"
      - name: Commit if changed
        run: |
          git config user.name  "stock-history-bot"
          git config user.email "bot@users.noreply.github.com"
          git add "$DATA_DIR/stock_history.csv" "$DATA_DIR/stock_overview_seed.csv"
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "data: deep stock-history backfill from Shopify (${{ inputs.store }}, since ${{ inputs.since }})"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
